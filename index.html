
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREETHECHIGHBOYS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #030712;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow: hidden;
}

.container {
  width: 100%;
  max-width: 850px;
  text-align: center;
  position: relative;
}

.container::before {
  content: "";
  position: absolute;
  width: 350px;
  height: 350px;
  background: #0066ff;
  filter: blur(150px);
  opacity: 0.15;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: -1;
}

h1 {
  font-size: clamp(24px, 5vw, 43px);
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 18px;
}

h1 span {
  color: #168cff;
  text-shadow: 0 0 15px #087bff;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 4px;
  color: #9caecb;
  margin-bottom: 50px;
}

.orbit {
  width: 280px;
  height: 65px;
  border: 1px solid #087bff;
  border-radius: 50%;
  transform: rotate(-8deg);
  margin: 0 auto -35px;
  opacity: 0.65;
  box-shadow: 0 0 15px #087bff;
}

.search-area {
  display: flex;
  gap: 12px;
  width: 100%;
}

input {
  flex: 1;
  min-width: 0;
  padding: 19px 22px;
  background: #081225;
  border: 1px solid #087bff;
  border-radius: 40px;
  color: white;
  font-size: 15px;
  outline: none;
  box-shadow: 0 0 15px #063c83;
}

input:focus {
  border-color: #38a9ff;
  box-shadow: 0 0 22px #087bff;
}

button {
  padding: 18px 30px;
  border: none;
  border-radius: 40px;
  background: linear-gradient(120deg, #168cff, #0645d9);
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 18px #075dff;
}

button:hover {
  box-shadow: 0 0 30px #168cff;
  transform: translateY(-2px);
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#status {
  margin-top: 32px;
  min-height: 22px;
  color: #42aaff;
  font-size: 12px;
  letter-spacing: 2px;
}

.footer {
  margin-top: 65px;
  color: #60799f;
  font-size: 11px;
  letter-spacing: 4px;
}

@media(max-width: 550px) {
  .search-area {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .subtitle {
    letter-spacing: 2px;
  }

  .orbit {
    width: 220px;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="orbit"></div>

  <h1>FREE<span>THECHIGHBOYS</span></h1>

  <p class="subtitle">
    UNLOCK YOUR BROWSING EXPERIENCE
  </p>

  <form class="search-area" id="searchForm">
    <input
      type="text"
      id="website"
      placeholder="Enter website address..."
      autocomplete="off"
      required
    >

    <button type="submit" id="searchButton">
      SEARCH ↗
    </button>
  </form>

  <div id="status" aria-live="polite"></div>

  <div class="footer">
    FAST • SECURE • FREE
  </div>

</main>

<script>
const form = document.getElementById("searchForm");
const input = document.getElementById("website");
const button = document.getElementById("searchButton");
const status = document.getElementById("status");

const SHORT_ID = "_6HzLIJPH2A";

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const requestedSite = input.value.trim();

  if (!requestedSite) {
    status.textContent = "PLEASE ENTER A WEBSITE ADDRESS";
    return;
  }

  button.disabled = true;
  input.disabled = true;

  const messages = [
    "INITIALIZING CONNECTION...",
    "VERIFYING REQUEST...",
    "ESTABLISHING SESSION...",
    "CONNECTION COMPLETE"
  ];

  let index = 0;

  status.textContent = messages[index];

  const interval = setInterval(() => {
    index++;

    if (index < messages.length) {
      status.textContent = messages[index];
    } else {
      clearInterval(interval);

      setTimeout(() => {
        window.location.assign(
          "https://www.youtube.com/shorts/" + SHORT_ID
        );
      }, 1000);
    }
  }, 1200);
});
</script>

</body>
</html>
