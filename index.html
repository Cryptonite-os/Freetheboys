
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREETHECHIGHBOYS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #02050d;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 45%,
    rgba(0, 90, 255, 0.15), transparent 60%);
  pointer-events: none;
}

.container {
  width: 90%;
  max-width: 1050px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.orbit {
  position: absolute;
  width: 430px;
  height: 95px;
  border: 2px solid #087bff;
  border-radius: 50%;
  transform: rotate(-9deg);
  top: -35px;
  left: 50%;
  translate: -50% 0;
  opacity: 0.7;
  box-shadow: 0 0 18px #087bff;
  pointer-events: none;
}

h1 {
  font-size: clamp(27px, 5vw, 49px);
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 20px;
  position: relative;
}

h1 span {
  color: #078cff;
  text-shadow: 0 0 18px #087bff;
}

.subtitle {
  color: #aabbd5;
  letter-spacing: 5px;
  font-size: 12px;
  margin-bottom: 55px;
}

.search-area {
  display: flex;
  gap: 15px;
  width: 100%;
}

input {
  flex: 1;
  min-width: 0;
  padding: 20px;
  background: #050b18;
  border: 2px solid #087bff;
  border-radius: 40px;
  color: white;
  font-size: 16px;
  outline: none;
  box-shadow: 0 0 15px rgba(0, 110, 255, 0.25);
}

input:focus {
  box-shadow: 0 0 22px #087bff;
}

button {
  padding: 18px 35px;
  border: none;
  border-radius: 35px;
  background: linear-gradient(110deg, #00aaff, #064dff);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0, 110, 255, 0.7);
  transition: 0.3s;
}

button:hover {
  transform: scale(1.04);
  box-shadow: 0 0 30px #087bff;
}

#status {
  margin-top: 35px;
  color: #36aaff;
  font-size: 14px;
  letter-spacing: 2px;
  min-height: 20px;
}

.bottom {
  margin-top: 65px;
  color: #7890b5;
  font-size: 12px;
  letter-spacing: 5px;
}

@media(max-width: 600px) {
  .search-area {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .subtitle {
    letter-spacing: 2px;
    margin-bottom: 35px;
  }

  .orbit {
    width: 260px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="orbit"></div>

  <h1>FREE<span>THECHIGHBOYS</span></h1>

  <p class="subtitle">
    UNLOCK YOUR BROWSING EXPERIENCE
  </p>

  <form class="search-area" id="searchForm">
    <input
      type="text"
      id="website"
      placeholder="Enter website address..."
      autocomplete="off"
      required
    >

    <button type="submit">SEARCH ↗</button>
  </form>

  <div id="status"></div>

  <div class="bottom">
    FAST &nbsp; • &nbsp; SECURE &nbsp; • &nbsp; FREE
  </div>

</div>

<script>
const form = document.getElementById("searchForm");
const statusText = document.getElementById("status");
const website = document.getElementById("website");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  if (!website.value.trim()) return;

  const requestedSite = website.value.trim();

  form.querySelector("button").disabled = true;
  website.disabled = true;

  statusText.textContent = "INITIALIZING CONNECTION...";

  setTimeout(() => {
    statusText.textContent = "VERIFYING REQUEST...";

    setTimeout(() => {
      statusText.textContent = "CONNECTION COMPLETE";

      setTimeout(() => {
        window.location.href =
          "https://www.youtube.com/watch?v=dQw4w9WgXcQ&autoplay=1";
      }, 1000);

    }, 1200);

  }, 1200);
});
</script>

</body>
</html>
